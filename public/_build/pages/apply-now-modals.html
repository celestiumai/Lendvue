<!-- Generated from the live Gravity Forms (Apply Now - Equipment Financing / Working Capital). -->
<div class="modal-overlay" id="modal-equipment-quote" aria-hidden="true">
  <div class="modal-box" role="dialog" aria-modal="true" aria-labelledby="eq-modal-title">
    <button type="button" class="modal-close" data-modal-close aria-label="Close">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
    </button>
    <h2 id="eq-modal-title">About You</h2>
    <p class="modal-note">Please note that your information is saved as you go &mdash; if we get disconnected, we can still follow up with you.</p>
    <form data-ajax-form="Apply Now - Equipment Financing" data-redirect="/thank-you-for-your-info/" data-multistep data-partial-step1 novalidate>
      <input type="text" name="website" class="honeypot" tabindex="-1" autocomplete="off" aria-hidden="true">
        <div class="form-step is-active" data-step="1">
          <div class="gf-grid gf-grid-2">
          <div class="gf-field gf-half"><label class="visually-hidden" for="eq-first">First Name (required)</label><input type="text" id="eq-first" name="first_name" placeholder="First Name" required autocomplete="given-name"></div>
          <div class="gf-field gf-half"><label class="visually-hidden" for="eq-last">Last Name (required)</label><input type="text" id="eq-last" name="last_name" placeholder="Last Name" required autocomplete="family-name"></div>
          <div class="gf-field gf-half"><label class="visually-hidden" for="eq-email">Email (required)</label><input type="email" id="eq-email" name="email" placeholder="Email" required autocomplete="email"></div>
          <div class="gf-field gf-half"><label class="visually-hidden" for="eq-phone">Phone (required)</label><input type="tel" id="eq-phone" name="phone" placeholder="Phone" required autocomplete="tel"></div>
          <div class="gf-field gf-full"><label class="visually-hidden" for="eq-business">Business Name (required)</label><input type="text" id="eq-business" name="business_name" placeholder="Business Name" required autocomplete="organization"></div>
          <div class="gf-field gf-full"><label class="visually-hidden" for="eq-amount">Finance Amount ($15,000 minimum) (required)</label><input type="number" id="eq-amount" name="finance_amount" placeholder="Finance Amount ($15,000 minimum)" min="15000" step="1" inputmode="numeric" required></div>
          <div class="gf-field gf-full"><label class="visually-hidden" for="eq-timing">How soon do you need financing? (required)</label><select id="eq-timing" name="funding_timeline" required><option value="">How soon do you need financing?</option><option>Need funding ASAP</option><option>Within 30 days</option><option>Within 90 days</option><option>Just gathering info</option></select></div>
          <div class="gf-field gf-full gf-checks">
            <label><input type="checkbox" name="sms_transactional" value="yes"> I agree to receive Transactional SMS messages from Lendvue related to my appointments.</label>
            <label><input type="checkbox" name="sms_promotional" value="yes"> I agree to receive Promotional SMS messages from Lendvue about new services or offers.</label>
          </div>
          </div>
          <div class="gf-footer gf-footer-left"><button type="button" class="gf-button" data-step-next>Next</button></div>
        </div>
        <div class="form-step" data-step="2">
          <div class="gf-grid gf-grid-2">
          <div class="gf-field gf-half gf-labelled"><label for="eq-years">How many years have you been in business?</label><select id="eq-years" name="years_in_business" required><option value="">Choose from below...</option><option>Startup/Less than a year</option><option>1-2 Years</option><option>3-5 Years</option><option>5+ Years</option></select></div>
          <div class="gf-field gf-half gf-labelled"><label for="eq-prior">Have you secured equipment financing under the business name in the past?</label><select id="eq-prior" name="prior_equipment_financing" required><option value="">Choose from below...</option><option>Yes</option><option>No</option></select></div>
          <div class="gf-field gf-half gf-labelled"><label for="eq-income">Business income reported last year?</label><select id="eq-income" name="business_income_last_year" required><option value="">Choose from below...</option><option>No income filed</option><option>Under $100K</option><option>$100k - $250K</option><option>$250K - $1MM</option><option>$1MM+</option><option>$5MM+</option></select></div>
          <div class="gf-field gf-half gf-labelled"><label for="eq-credit">What range is your personal credit score?</label><select id="eq-credit" name="credit_score_range" required><option value="">Choose from below...</option><option>750+</option><option>700+</option><option>650+</option><option>600+</option><option>Below 600</option></select></div>
          <div class="gf-field gf-half gf-labelled"><label for="eq-mortgage">Do you have an open mortgage account on your personal credit?</label><select id="eq-mortgage" name="open_mortgage" required><option value="">Choose from below...</option><option>Yes</option><option>No</option></select></div>
          <div class="gf-field gf-half gf-labelled"><label for="eq-auto">Do you have an auto loan on your personal credit?</label><select id="eq-auto" name="auto_loan" required><option value="">Choose from below...</option><option>Yes</option><option>No</option></select></div>
          <div class="gf-field gf-half gf-labelled"><label for="eq-cards">Do you have an open credit card(s) on your personal credit?</label><select id="eq-cards" name="open_credit_cards" required><option value="">Choose from below...</option><option>Yes</option><option>No</option></select></div>
          <div class="gf-field gf-half gf-labelled"><label for="eq-bk">Any bankruptcies within the last 10 years?</label><select id="eq-bk" name="bankruptcy_10yr" required><option value="">Choose from below...</option><option>Yes</option><option>No</option></select></div>
          <div class="gf-field gf-half gf-labelled"><label for="eq-liens">Are there any open tax liens or judgements?</label><select id="eq-liens" name="tax_liens_judgements" required><option value="">Choose from below...</option><option>Yes</option><option>No</option></select></div>
          <div class="gf-field gf-half gf-labelled"><label for="eq-childsupport">Any child support collections reported on credit?</label><select id="eq-childsupport" name="child_support_collections" required><option value="">Choose from below...</option><option>Yes</option><option>No</option></select></div>
          </div>
          <div class="gf-footer gf-footer-left"><button type="button" class="gf-button gf-button-secondary" data-step-prev>Previous</button> <button type="submit" class="gf-button">Apply Now</button></div>
        </div>
      <div class="form-status" role="status"></div>
    </form>
  </div>
</div>
