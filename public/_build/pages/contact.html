<section class="contact-hero">
  <div class="container">
    <div class="contact-card">
      <div class="contact-card-panel">
        <h1>Get in Touch</h1>
        <p>Have questions about our products or services? Complete the form below and we will respond as soon as possible.</p>
        <p>We are available Monday &ndash; Friday 9AM to 5PM, PST</p>
        <p><a href="tel:+18008667231">800-866-7231</a></p>
        <form class="contact-form" data-ajax-form="Contact" data-redirect="/thank-you/" novalidate>
          <input type="text" name="website" class="honeypot" tabindex="-1" autocomplete="off" aria-hidden="true">
          <div class="gf-grid">
            <div class="gf-field gf-half"><label class="visually-hidden" for="c-name">First Name (required)</label><input type="text" id="c-name" name="first_name" placeholder="First Name" required autocomplete="given-name"></div>
            <div class="gf-field gf-half"><label class="visually-hidden" for="c-email">Email (required)</label><input type="email" id="c-email" name="email" placeholder="Email" required autocomplete="email"></div>
            <div class="gf-field gf-full"><label class="visually-hidden" for="c-subject">Subject (required)</label><input type="text" id="c-subject" name="subject" placeholder="Subject" required></div>
            <div class="gf-field gf-full"><label class="visually-hidden" for="c-message">Message (required)</label><textarea id="c-message" name="message" placeholder="Type your message here..." required></textarea></div>
          </div>
          <div class="gf-footer gf-footer-left">
            <button type="submit" class="gf-button">Submit</button>
          </div>
          <div class="form-status" role="status"></div>
        </form>
      </div>
      <div class="contact-card-photo" role="img" aria-label="Lendvue client on the phone at his job site"></div>
    </div>
  </div>
</section>

<section class="contact-map" aria-label="Map to Lendvue's office">
  <div class="container container-xl">
    <iframe title="Lendvue office, 11801 Pierce St #200, Riverside, CA 92505" src="https://www.google.com/maps?q=Lendvue%2C+11801+Pierce+St+%23200%2C+Riverside%2C+CA+92505&amp;z=11&amp;output=embed" width="1400" height="300" loading="lazy" referrerpolicy="no-referrer-when-downgrade" allowfullscreen></iframe>
  </div>
</section>
