<section class="hero hero-blue">
  <div class="container text-center">
    <div class="hero-inner" style="max-width:640px;margin:0 auto;">
      <h1>Get in Touch</h1>
      <p class="lede" style="margin:0 auto;">Have questions about our products or services? Complete the form below and we will respond as soon as possible.</p>
      <p class="lede" style="margin:12px auto 0;">We are available Monday &ndash; Friday 9AM to 5PM, PST<br><a href="tel:+18008667231" style="color:#fff;font-weight:700;">800-866-7231</a></p>
    </div>
  </div>
</section>

<section aria-labelledby="contact-heading">
  <div class="container" style="max-width:640px;">
    <h2 id="contact-heading" class="visually-hidden">Contact form</h2>
    <div class="inline-card">
      <form data-ajax-form="Contact" data-redirect="/thank-you/" novalidate>
        <input type="text" name="website" class="honeypot" tabindex="-1" autocomplete="off" aria-hidden="true">
        <div class="form-grid">
          <div class="field field-full"><label for="c-name">First Name</label><input type="text" id="c-name" name="first_name" required autocomplete="given-name"></div>
          <div class="field field-full"><label for="c-email">Email</label><input type="email" id="c-email" name="email" required autocomplete="email"></div>
          <div class="field field-full"><label for="c-subject">Subject</label><input type="text" id="c-subject" name="subject" required></div>
          <div class="field field-full"><label for="c-message">Message</label><textarea id="c-message" name="message" rows="5" required></textarea></div>
        </div>
        <div class="form-actions">
          <button type="submit" class="btn btn-primary btn-block">Send Message</button>
          <p class="form-note">By submitting, you agree to our <a href="/privacy-policy/">Privacy Policy</a> and <a href="/terms-of-use/">Terms of Use</a>.</p>
        </div>
        <div class="form-status" role="status"></div>
      </form>
    </div>
  </div>
</section>
